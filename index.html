    // --- STARFIELD CANVAS COMPONENT ---
    const StarfieldCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        window.addEventListener('resize', handleResize);

        const numStars = Math.floor((width * height) / 3000);
        const stars = [];

        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.5,
            alpha: Math.random(),
            speed: Math.random() * 0.05 + 0.01,
            color: Math.random() > 0.3 ? '#ffffff' : '#2c67ed'
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          stars.forEach((star) => {
            star.alpha += (Math.random() - 0.5) * 0.02;
            if (star.alpha < 0.1) star.alpha = 0.1;
            if (star.alpha > 1) star.alpha = 1;

            star.y -= star.speed;
            if (star.y < 0) {
              star.y = height;
              star.x = Math.random() * width;
            }

            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = star.color;
            ctx.globalAlpha = star.alpha;
            ctx.shadowBlur = star.radius > 1 ? 8 : 0;
            ctx.shadowColor = star.color;
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas 
          ref={canvasRef} 
          className="fixed top-0 left-0 w-full h-full pointer-events-none z-0" 
        />
      );
    };

    // --- TYPEWRITER HOOK ---
    const useTypewriter = (words, speed = 100, delay = 2000) => {
      const [text, setText] = useState('');
      const [wordIndex, setWordIndex] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);

      useEffect(() => {
        if (!words || words.length === 0) return;
        const currentWord = words[wordIndex % words.length];

        const timer = setTimeout(() => {
          if (isDeleting) {
            setText(currentWord.substring(0, text.length - 1));
          } else {
            setText(currentWord.substring(0, text.length + 1));
          }

          if (!isDeleting && text === currentWord) {
            setTimeout(() => setIsDeleting(true), delay);
          } else if (isDeleting && text === '') {
            setIsDeleting(false);
            setWordIndex((prev) => prev + 1);
          }
        }, isDeleting ? speed / 2 : speed);

        return () => clearTimeout(timer);
      }, [text, isDeleting, wordIndex, words, speed, delay]);

      return text;
    };

              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-[#0b0d17] border border-[#2c67ed]/50 rounded-2xl max-w-lg w-full overflow-hidden shadow-[0_0_40px_rgba(44,103,237,0.4)] relative cursor-default"
              >
                <button
                  onClick={() => setSelectedProject(null)}
                  className="absolute top-3 right-3 p-1.5 rounded-full bg-black/60 text-slate-300 hover:text-white z-10 cursor-pointer"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="h-48 overflow-hidden relative">
                  <img src={selectedProject.image} alt={selectedProject.title} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#0b0d17] via-transparent to-transparent" />
                </div>

                <div className="p-6">
                  <span className="text-[10px] font-mono px-2.5 py-1 rounded-full bg-[#2c67ed]/20 text-[#2c67ed] border border-[#2c67ed]/40 mb-2 inline-block">
                    {selectedProject.category}
                  </span>
                  <h3 className="text-xl font-bold text-white mb-2">{selectedProject.title}</h3>
                  <p className="text-xs text-slate-300 leading-relaxed mb-6">
                    {selectedProject.description}
                  </p>

                  <div className="flex flex-wrap gap-1.5 mb-6">
                    {selectedProject.tags.map((t, idx) => (
                      <span key={idx} className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/10 text-slate-200">
                        {t}
                      </span>
                    ))}
                  </div>

                  <div className="flex gap-3">
                    <a
                      href={selectedProject.demoUrl}
                      onClick={(e) => { e.preventDefault(); alert("Live Demo Preview"); }}
                      className="flex-1 py-2.5 rounded-xl bg-[#2c67ed] text-white text-xs font-semibold flex items-center justify-center gap-1.5 hover:bg-indigo-600 transition-colors"
                    >
                      <span>Live Demo</span>
                      <Icon name="externalLink" className="w-3.5 h-3.5" />
                    </a>
                    <a
                      href={selectedProject.githubUrl}
                      onClick={(e) => { e.preventDefault(); alert("GitHub Repository"); }}
                      className="flex-1 py-2.5 rounded-xl bg-white/10 text-slate-200 text-xs font-semibold flex items-center justify-center gap-1.5 hover:bg-white/20 transition-colors"
                    >
                      <span>GitHub Code</span>
                      <Icon name="github" className="w-3.5 h-3.5" />
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* --- FOOTER --- */}
          <footer className="py-8 px-4 border-t border-white/5 relative z-10 text-center">
            <p className="text-xs text-slate-500 font-mono">
              © {new Date().getFullYear()} Arif Hasbilah. Crafted with React & Tailwind CSS.
            </p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
